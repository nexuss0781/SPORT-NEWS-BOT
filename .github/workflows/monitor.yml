name: Monitor channels

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/monitor
        run: curl -fsS -m 90 "https://sport-news-bot.vercel.app/api/monitor?key=${{ secrets.MONITOR_SECRET }}"